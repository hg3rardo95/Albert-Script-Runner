			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# Only run for Archive/Install (Distribution)\nif [ \"${ACTION:-}\" != \"install\" ]; then\n  echo \"Skipping python bundle copy (ACTION=${ACTION:-})\"\n  exit 0\nfi\n\nSRC_ENGINE_DIR=\"${SRCROOT}/python-engine\"\nSRC_RUNTIME_DIR=\"${SRC_ENGINE_DIR}/python-runtime\"   # runtime inside python-engine (preferred)\nALT_RUNTIME_DIR=\"${SRCROOT}/python-runtime\"          # runtime beside python-engine (fallback)\n\nDEST_RESOURCES_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDEST_ENGINE_DIR=\"${DEST_RESOURCES_DIR}/python-engine\"\nDEST_ENGINE_RUNTIME_DIR=\"${DEST_ENGINE_DIR}/python-runtime\"  # <-- runtime will live here (inside engine)\n\necho \"Archiving: copying python engine/runtime into app Resources…\"\necho \"SRCROOT=${SRCROOT}\"\necho \"DEST_RESOURCES_DIR=${DEST_RESOURCES_DIR}\"\n\nif [ ! -d \"${SRC_ENGINE_DIR}\" ]; then\n  echo \"ERROR: python-engine folder not found at: ${SRC_ENGINE_DIR}\"\n  exit 1\nfi\n\n# Copy python-engine into Contents/Resources/python-engine\nmkdir -p \"${DEST_ENGINE_DIR}\"\nrsync -a --delete \"${SRC_ENGINE_DIR}/\" \"${DEST_ENGINE_DIR}/\"\n\n# Ensure runtime ends up INSIDE python-engine in the app bundle\n# Prefer python-engine/python-runtime from source repo; else fallback to repo-root python-runtime\nif [ -d \"${SRC_RUNTIME_DIR}\" ]; then\n  mkdir -p \"${DEST_ENGINE_RUNTIME_DIR}\"\n  rsync -a --delete \"${SRC_RUNTIME_DIR}/\" \"${DEST_ENGINE_RUNTIME_DIR}/\"\n  echo \"✅ Copied python runtime (from python-engine/python-runtime) => ${DEST_ENGINE_RUNTIME_DIR}\"\nelif [ -d \"${ALT_RUNTIME_DIR}\" ]; then\n  mkdir -p \"${DEST_ENGINE_RUNTIME_DIR}\"\n  rsync -a --delete \"${ALT_RUNTIME_DIR}/\" \"${DEST_ENGINE_RUNTIME_DIR}/\"\n  echo \"✅ Copied python runtime (from repo-root python-runtime) => ${DEST_ENGINE_RUNTIME_DIR}\"\nelse\n  echo \"WARNING: no python-runtime folder found. Standalone runtime will be missing.\"\nfi\n\necho \"✅ Copied python-engine => ${DEST_ENGINE_DIR}\"\n\n# Codesign bundled runtime and any dylibs (recommended for macOS)\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n  echo \"Codesigning embedded python bits with: ${EXPANDED_CODE_SIGN_IDENTITY}\"\n\n  # Sign dylibs first, then executables (runtime inside python-engine)\n  if [ -d \"${DEST_ENGINE_RUNTIME_DIR}\" ]; then\n    find \"${DEST_ENGINE_RUNTIME_DIR}\" -type f \\( -name \"*.dylib\" -o -name \"*.so\" \\) -print0 | \\\n      xargs -0 -I{} /usr/bin/codesign --force --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"{}\" || true\n\n    if [ -d \"${DEST_ENGINE_RUNTIME_DIR}/bin\" ]; then\n      find \"${DEST_ENGINE_RUNTIME_DIR}/bin\" -type f -maxdepth 1 -print0 | \\\n        xargs -0 -I{} /usr/bin/codesign --force --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"{}\" || true\n    fi\n  fi\n\n  # Sign python-engine native deps too (site-packages with compiled extensions)\n  if [ -d \"${DEST_ENGINE_DIR}\" ]; then\n    find \"${DEST_ENGINE_DIR}\" -type f \\( -name \"*.so\" -o -name \"*.dylib\" \\) -print0 | \\\n      xargs -0 -I{} /usr/bin/codesign --force --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \"{}\" || true\n  fi\nelse\n  echo \"Skipping codesign (no signing identity).\"\nfi\n";
		};
