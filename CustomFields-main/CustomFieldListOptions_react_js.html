<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Field List Options (React)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 980px;
      margin: 28px auto;
      padding: 0 16px 70px;
      line-height: 1.35;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .muted { opacity: .75; margin: 0 0 16px; }
    .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .right { margin-left: auto; }
    button {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .step {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      background: #fff;
    }
    .title { font-weight: 650; margin-bottom: 8px; }
    label { display: block; margin: 8px 0 6px; font-weight: 650; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0 8px;
    }
    .chip {
      border: 1px solid #d0d0d0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #f7f7f7;
      user-select: none;
    }
    .chip.selected {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .hint { font-size: 12px; opacity: .8; margin-top: 6px; }
    .ok { color: #0b7a32; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .error { color: #b00020; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    @media (max-width: 760px) {
      .cards { grid-template-columns: 1fr; }
    }
    .card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px;
      background: #fafafa;
    }
    .cardLabel { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
    .cardValue { font-size: 14px; margin-top: 4px; word-break: break-word; }
    .statusBanner {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .statusGood {
      background: #eaf8ee;
      color: #0f5f2a;
      border-color: #b9e7c5;
    }
    .statusBad {
      background: #fff0f0;
      color: #8b0000;
      border-color: #ffc8c8;
    }
    .statusNeutral {
      background: #f6f6f6;
      color: #222;
      border-color: #e0e0e0;
    }
    .ctaRow {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .suggestionList {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .suggestionBtn {
      text-align: left;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      padding: 10px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .suggestionBtn:hover {
      border-color: #111;
      background: #fff;
    }
    .suggestionBtn.selected {
      border-color: #1f7a3b;
      background: #eaf8ee;
    }
    .suggestionTitle {
      font-weight: 700;
      font-size: 14px;
    }
    .suggestionMeta {
      margin-top: 4px;
      font-size: 12px;
      opacity: .85;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f7f7f7; }
    pre {
      margin: 10px 0 0;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }
    pre.jwtExpired {
      border-color: #b00020;
      background: #fff5f5;
      color: #b00020;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useMemo, useState } = React;

    const API_URLS = {
      "Sandbox": "https://sandbox.albertinvent.com",
      "Production": "https://app.albertinvent.com",
      "Dev Environment": "https://dev.albertinventdev.com"
    };
    const CTF_ID_STORAGE_KEY = "cflo_ctf_id";

    function parseCommaList(s) {
      return String(s || "")
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);
    }

    function decodeJwt(token) {
      const parts = token.split(".");
      if (parts.length !== 3) return null;
      try {
        const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
        return {
          tenantId: payload.tenantId,
          partition: payload.partition,
          class: payload.class,
          name: payload.name,
          email: payload.email,
          iss: payload.iss,
          exp: payload.exp
        };
      } catch {
        return null;
      }
    }

    function formatJwtInfo(info) {
      if (!info) return null;
      const out = { ...info };
      if ("exp" in out) delete out.exp;
      const expMs = Number(info.exp) * 1000;
      if (Number.isFinite(expMs)) {
        out.expiration = new Date(expMs).toLocaleString();
      }
      return out;
    }

    function isJwtExpiredByDay(info) {
      const expMs = Number(info?.exp) * 1000;
      if (!Number.isFinite(expMs)) return false;
      const expDay = new Date(expMs);
      expDay.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return expDay.getTime() < today.getTime();
    }

    function inferEnvironmentFromIssuer(iss) {
      const raw = String(iss || "").trim();
      if (!raw) return "";

      let host = raw.toLowerCase();
      try {
        const parsed = new URL(raw);
        host = (parsed.hostname || "").toLowerCase();
      } catch {
        // Not a full URL; fall back to direct suffix matching on the raw issuer text.
      }

      if (host.endsWith(".demo")) return "Sandbox";
      if (host.endsWith(".app2")) return "Production";
      if (host.endsWith(".dev")) return "Dev Environment";
      return "";
    }

    function extractErrorMessages(raw) {
      const messages = [];
      const seen = new Set();

      function pushMessage(msg) {
        const text = String(msg || "").trim();
        if (!text || seen.has(text)) return;
        seen.add(text);
        messages.push(text);
      }

      function walk(value) {
        if (value === null || value === undefined) return;
        if (typeof value === "string") return;
        if (Array.isArray(value)) return value.forEach(walk);
        if (typeof value === "object") {
          if (typeof value.msg === "string") pushMessage(value.msg);
          if (typeof value.message === "string") pushMessage(value.message);
          Object.values(value).forEach(walk);
        }
      }

      let parsed = raw;
      if (typeof raw === "string") {
        const trimmed = raw.trim();
        if (!trimmed) return "(empty response body)";
        try { parsed = JSON.parse(trimmed); }
        catch { return trimmed; }
      }

      walk(parsed);
      if (messages.length) return messages.join("\n");
      if (typeof parsed === "string") return parsed;
      try { return JSON.stringify(parsed, null, 2); }
      catch { return String(parsed); }
    }

    function normalizeCustomField(data) {
      if (!data || typeof data !== "object") return null;
      if (data.item && typeof data.item === "object") return data.item;
      if (data.customField && typeof data.customField === "object") return data.customField;
      return data;
    }

    function summarizeCustomField(field) {
      return {
        id: field.id || field.albertId || field.ctfId || field.customFieldId || null,
        name: field.name || null,
        labelName: field.labelName || null,
        type: field.type || null,
        category: field.category || field.listCategory || field.listType || null
      };
    }

    function similarity(a, b) {
      const sa = String(a || "").toLowerCase();
      const sb = String(b || "").toLowerCase();
      if (!sa || !sb) return 0;
      const dp = Array(sa.length + 1).fill(0).map(() => Array(sb.length + 1).fill(0));
      for (let i = 0; i <= sa.length; i++) dp[i][0] = i;
      for (let j = 0; j <= sb.length; j++) dp[0][j] = j;
      for (let i = 1; i <= sa.length; i++) {
        for (let j = 1; j <= sb.length; j++) {
          const cost = sa[i - 1] === sb[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return 1 - (dp[sa.length][sb.length] / (Math.max(sa.length, sb.length) || 1));
    }

    function isCtfId(value) {
      return /^CTF\d+$/i.test(String(value || "").trim());
    }

    function hiddenRank(value) {
      if (value === false) return 2;
      if (value === true) return 0;
      return 1;
    }

    function scoreLabelNameMatch(query, labelName) {
      const q = String(query || "").trim().toLowerCase();
      const label = String(labelName || "").trim().toLowerCase();
      if (!q || !label) return 0;
      let score = similarity(q, label);
      if (q === label) score += 1;
      else if (label.includes(q)) score += 0.4;
      return score;
    }

    function singularizeModule(service) {
      const map = {
        inventories: "inventory",
        tasks: "task",
        lots: "lot",
        datatemplates: "data template",
        parametergroups: "parameter group",
        projects: "project",
        users: "user"
      };
      const key = String(service || "").trim().toLowerCase();
      if (!key) return "unknown";
      if (map[key]) return map[key];
      if (key.endsWith("ies")) return `${key.slice(0, -3)}y`;
      if (key.endsWith("s")) return key.slice(0, -1);
      return key;
    }

    function baseUrl(envChoice) {
      return (API_URLS[envChoice] || "").replace(/\/+$/, "");
    }

    async function fetchCustomFieldById(envChoice, token, ctfId) {
      const safeId = encodeURIComponent(ctfId.trim());
      const url = `${baseUrl(envChoice)}/api/v3/customfields/${safeId}`;
      const resp = await fetch(url, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token.trim()}` }
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      return { status: resp.status, data, text };
    }

    async function fetchCustomFields(envChoice, token) {
      const url = `${baseUrl(envChoice)}/api/v3/customfields/?limit=200`;
      const resp = await fetch(url, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token.trim()}` }
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      const items = Array.isArray(data)
        ? data
        : (Array.isArray(data?.items) ? data.items : (Array.isArray(data?.Items) ? data.Items : []));
      return { status: resp.status, text, items };
    }

    async function sendListOption(envChoice, token, name, listType, category) {
      const url = `${baseUrl(envChoice)}/api/v3/lists`;
      const payload = { name, listType, category };
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token.trim()}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      const albertId = data && (data.albertId || data.id || data.listId) ? (data.albertId || data.id || data.listId) : null;
      return { status: resp.status, text, albertId };
    }

    function App() {
      const [ctfId, setCtfId] = useState(localStorage.getItem(CTF_ID_STORAGE_KEY) || "");
      const [envChoice, setEnvChoice] = useState("");
      const [token, setToken] = useState("");
      const [jwtInfo, setJwtInfo] = useState(null);
      const [ctfInfo, setCtfInfo] = useState(null);
      const [validated, setValidated] = useState(false);
      const [listOptionsRaw, setListOptionsRaw] = useState("");
      const [validateError, setValidateError] = useState("");
      const [validateStatus, setValidateStatus] = useState("");
      const [sendError, setSendError] = useState("");
      const [listOptionResponses, setListOptionResponses] = useState([]);
      const [listOptionStarted, setListOptionStarted] = useState(false);
      const [listOptionProcessed, setListOptionProcessed] = useState(0);
      const [listOptionTotal, setListOptionTotal] = useState(0);
      const [listOptionSuccess, setListOptionSuccess] = useState(0);
      const [listOptionFailures, setListOptionFailures] = useState([]);
      const [loading, setLoading] = useState(false);
      const [sending, setSending] = useState(false);
      const [lookupSuggestions, setLookupSuggestions] = useState([]);
      const [selectedSuggestionId, setSelectedSuggestionId] = useState("");
      const [resolvedCtfId, setResolvedCtfId] = useState("");

      const jwtDisplay = useMemo(() => (
        jwtInfo ? JSON.stringify(formatJwtInfo(jwtInfo), null, 2) : ""
      ), [jwtInfo]);
      const jwtExpired = useMemo(() => isJwtExpiredByDay(jwtInfo), [jwtInfo]);

      function clearValidationState() {
        setValidated(false);
        setCtfInfo(null);
        setValidateError("");
        setValidateStatus("");
        setSendError("");
        setListOptionResponses([]);
        setListOptionStarted(false);
        setListOptionProcessed(0);
        setListOptionTotal(0);
        setListOptionSuccess(0);
        setListOptionFailures([]);
        setResolvedCtfId("");
        setLookupSuggestions([]);
        setSelectedSuggestionId("");
      }

      function clearOnInputTargetChange() {
        clearValidationState();
        setListOptionsRaw("");
        setLookupSuggestions([]);
        setSelectedSuggestionId("");
      }

      async function validateById(trimmedToken, targetId) {
        const resp = await fetchCustomFieldById(envChoice, trimmedToken, targetId);
        if (resp.status === 401 || resp.status === 403) {
          setValidateError("Bearer token is invalid for this environment.");
          return false;
        }
        if (resp.status === 404) {
          setValidateError("No custom field found for that CTF ID.");
          return false;
        }
        if (resp.status < 200 || resp.status >= 300) {
          setValidateError(`Custom field lookup failed (${resp.status}).`);
          return false;
        }

        const field = normalizeCustomField(resp.data);
        if (!field) {
          setValidateError("Custom field response could not be parsed.");
          return false;
        }

        const summary = summarizeCustomField(field);
        if ((summary.type || "").toLowerCase() !== "list") {
          setValidateError(`CTF "${targetId}" is type "${summary.type || "unknown"}", not "list".`);
          return false;
        }
        if (!summary.name || !summary.category) {
          setValidateError("Custom field GET response did not include required list metadata (name/category).");
          return false;
        }

        setCtfInfo(summary);
        setResolvedCtfId(String(summary.id || targetId || "").trim());
        setValidated(true);
        setValidateStatus(`Validated ${String(summary.id || targetId || "").trim()}. You can now send list options.`);
        return true;
      }

      async function resolveByLabelName(trimmedToken, labelInput) {
        const lookup = await fetchCustomFields(envChoice, trimmedToken);
        if (lookup.status === 401 || lookup.status === 403) {
          setValidateError("Bearer token is invalid for this environment.");
          return [];
        }
        if (lookup.status < 200 || lookup.status >= 300) {
          setValidateError(`Custom field list lookup failed (${lookup.status}).`);
          return [];
        }

        const candidates = (lookup.items || [])
          .map((item) => {
            const id = String(item?.id || item?.albertId || item?.ctfId || item?.customFieldId || item?.fieldId || "").trim();
            const labelName = String(item?.labelName || "").trim();
            const status = String(item?.status || "").trim().toLowerCase();
            if (status === "inactive") return null;
            if (!id || !labelName) return null;
            const score = scoreLabelNameMatch(labelInput, labelName);
            if (score <= 0.6) return null;
            return {
              id,
              labelName,
              module: singularizeModule(item?.service),
              type: String(item?.type || "").trim() || "unknown",
              hidden: item?.hidden,
              score
            };
          })
          .filter(Boolean)
          .sort((a, b) => {
            const hiddenDiff = hiddenRank(b.hidden) - hiddenRank(a.hidden);
            if (hiddenDiff) return hiddenDiff;
            if (b.score !== a.score) return b.score - a.score;
            return a.labelName.localeCompare(b.labelName);
          })
          .slice(0, 5);

        if (!candidates.length) {
          setValidateError("No labelName matches were found.");
          return [];
        }
        setResolvedCtfId("");
        setSelectedSuggestionId("");
        setLookupSuggestions(candidates);
        return candidates;
      }

      async function handleValidate() {
        const trimmedInput = ctfId.trim();
        const trimmedToken = token.trim();

        if (!trimmedInput) {
          setValidateError("Custom field ID or Name is required.");
          return;
        }
        if (!envChoice) {
          setValidateError("Please select environment.");
          return;
        }
        if (!trimmedToken) {
          setValidateError("Bearer token is required.");
          return;
        }
        if (!decodeJwt(trimmedToken)) {
          setValidateError("Token does not appear to be a JWT (expected 3 segments).");
          return;
        }

        setValidateError("");
        setValidateStatus("");
        setSendError("");
        setListOptionResponses([]);
        setListOptionStarted(false);
        setListOptionProcessed(0);
        setListOptionTotal(0);
        setListOptionSuccess(0);
        setListOptionFailures([]);

        setLoading(true);
        try {
          if (isCtfId(trimmedInput)) {
            setSelectedSuggestionId("");
            await validateById(trimmedToken, trimmedInput);
          } else {
            await resolveByLabelName(trimmedToken, trimmedInput);
          }
        } catch (err) {
          setValidateError(`Validation failed: ${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }

      async function handleSuggestionSelect(item) {
        const id = String(item?.id || "").trim();
        if (!id) return;
        setValidateError("");
        setValidateStatus("");
        setSendError("");
        setCtfInfo(null);
        setValidated(false);
        setResolvedCtfId("");
        setSelectedSuggestionId(id);
        setListOptionResponses([]);
        setListOptionStarted(false);
        setListOptionProcessed(0);
        setListOptionTotal(0);
        setListOptionSuccess(0);
        setListOptionFailures([]);

        setLoading(true);
        try {
          await validateById(token.trim(), id);
        } catch (err) {
          setValidateError(`Validation failed: ${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }

      async function handleSend() {
        if (!validated || !ctfInfo) {
          setSendError("Validate the CTF first.");
          return;
        }

        const names = parseCommaList(listOptionsRaw);
        setListOptionsRaw(names.join(", "));
        if (!names.length) {
          setSendError("No list options provided.");
          return;
        }

        setSendError("");
        setListOptionStarted(true);
        setListOptionProcessed(0);
        setListOptionTotal(names.length);
        setListOptionSuccess(0);
        setListOptionFailures([]);
        setListOptionResponses([]);
        setSending(true);

        try {
          const responses = [];
          let processed = 0;
          let success = 0;
          const failures = [];

          for (const name of names) {
            const res = await sendListOption(envChoice, token, name, ctfInfo.name, ctfInfo.category);
            const ok = res.status >= 200 && res.status <= 299;
            if (ok) {
              success += 1;
            } else {
              failures.push({ optionName: name, status: res.status, message: extractErrorMessages(res.text) });
            }
            processed += 1;
            responses.push({ name, status: res.status, text: res.text, albertId: res.albertId, ok });
            setListOptionProcessed(processed);
            setListOptionSuccess(success);
            setListOptionFailures([...failures]);
            setListOptionResponses([...responses]);
          }
        } catch (err) {
          setSendError(`Sending failed: ${String(err?.message || err)}`);
        } finally {
          setSending(false);
        }
      }

      function handleRestart() {
        setCtfId("");
        localStorage.setItem(CTF_ID_STORAGE_KEY, "");
        setEnvChoice("");
        setToken("");
        setJwtInfo(null);
        setCtfInfo(null);
        setValidated(false);
        setListOptionsRaw("");
        setValidateError("");
        setValidateStatus("");
        setSendError("");
        setListOptionResponses([]);
        setListOptionStarted(false);
        setListOptionProcessed(0);
        setListOptionTotal(0);
        setListOptionSuccess(0);
        setListOptionFailures([]);
        setLookupSuggestions([]);
        setSelectedSuggestionId("");
        setResolvedCtfId("");
        setLoading(false);
        setSending(false);
      }

      function clearResults() {
        setValidated(false);
        setCtfInfo(null);
        setValidateError("");
        setValidateStatus("");
        setSendError("");
        setListOptionResponses([]);
        setListOptionStarted(false);
        setListOptionProcessed(0);
        setListOptionTotal(0);
        setListOptionSuccess(0);
        setListOptionFailures([]);
      }

      return (
        <>
          <div className="topbar">
            <h1 style={{ margin: 0 }}>Custom Field List Options (React)</h1>
            <button className="right" type="button" onClick={handleRestart}>Restart</button>
          </div>

          <p className="muted">
            Use this Custom Field API Builder to create list options for an existing list custom field. Validate the field first, then send comma-separated option names.
          </p>

          <div className="step">
            <div className="title">List Option Inputs</div>
            <div className="grid">
              <div>
                <label>Environment</label>
                <div className="chips">
                  {Object.keys(API_URLS).map((name) => {
                    const selected = envChoice === name;
                    return (
                      <span
                        key={name}
                        className={`chip ${selected ? "selected" : ""}`}
                        onClick={() => {
                          if (envChoice === name) return;
                          setEnvChoice(name);
                          clearOnInputTargetChange();
                        }}
                      >
                        {name}
                      </span>
                    );
                  })}
                </div>
                <label>Bearer Token</label>
                <input
                  type="password"
                  placeholder="Paste token"
                  aria-label="Bearer token"
                  value={token}
                  onChange={(e) => {
                    const nextToken = e.target.value;
                    const info = decodeJwt(nextToken.trim());
                    const inferredEnv = inferEnvironmentFromIssuer(info?.iss);
                    setToken(nextToken);
                    setJwtInfo(info);
                    if (inferredEnv) setEnvChoice(inferredEnv);
                    clearOnInputTargetChange();
                  }}
                />
                <pre className={jwtExpired ? "jwtExpired" : ""}>{jwtDisplay}</pre>
              </div>

              <div>
                <label>Custom Field ID or Name</label>
                <input
                  type="text"
                  placeholder="Example: CTF123 or Name"
                  aria-label="CTF ID"
                  value={ctfId}
                  onChange={(e) => {
                    const v = e.target.value;
                    setCtfId(v);
                    localStorage.setItem(CTF_ID_STORAGE_KEY, v);
                    clearOnInputTargetChange();
                  }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      e.preventDefault();
                      handleValidate();
                    }
                  }}
                />
                {lookupSuggestions.length ? (
                  <div className="suggestionList">
                    {lookupSuggestions.map((item) => (
                      <button
                        key={item.id}
                        type="button"
                        className={`suggestionBtn ${selectedSuggestionId === item.id ? "selected" : ""}`}
                        onClick={() => handleSuggestionSelect(item)}
                        disabled={loading || sending}
                      >
                        <div className="suggestionTitle">{item.labelName}</div>
                        <div className="suggestionMeta">
                          {item.id} | Module: {item.module || "unknown"} | Type: {item.type || "unknown"} | hidden: {item.hidden === true ? "true" : (item.hidden === false ? "false" : "unknown")}
                        </div>
                      </button>
                    ))}
                  </div>
                ) : null}
                {!loading && !isCtfId(ctfId.trim()) && lookupSuggestions.length > 0 && lookupSuggestions.length < 2 && !lookupSuggestions.some((item) => Number(item?.score || 0) >= 0.9) ? (
                  <div className="hint">If fewer than 2 options appear and this environment has more than 200 custom fields, this search may miss matches due to the API limit.</div>
                ) : null}
              </div>
            </div>

            <div className="error">{validateError}</div>
            {validateStatus ? <div className="ok">{validateStatus}</div> : null}
            <div className="ctaRow">
              <button type="button" onClick={clearResults} disabled={loading || sending}>Clear Results</button>
              <button className="primary" type="button" onClick={handleValidate} disabled={loading || sending}>
                {loading ? "Working..." : "Validate"}
              </button>
            </div>
          </div>

          {ctfInfo ? (
            <div className="step">
              <div className="title">Field Details</div>
              <div className="statusBanner statusNeutral">
                Validated list custom field {ctfInfo.id || resolvedCtfId || ctfId.trim()}.
              </div>
              <div className="cards">
                <div className="card"><div className="cardLabel">CTF ID</div><div className="cardValue">{ctfInfo.id || resolvedCtfId || ctfId.trim()}</div></div>
                <div className="card"><div className="cardLabel">Backend Name</div><div className="cardValue">{ctfInfo.name || "(missing)"}</div></div>
                <div className="card"><div className="cardLabel">Label Name</div><div className="cardValue">{ctfInfo.labelName || "(missing)"}</div></div>
                <div className="card"><div className="cardLabel">List Category</div><div className="cardValue">{ctfInfo.category || "(missing)"}</div></div>
              </div>
            </div>
          ) : null}

          {validated && ctfInfo ? (
            <div className="step">
              <div className="title">List Option Creation (comma-separated)</div>
              <input
                type="text"
                placeholder="List option names"
                aria-label="List option names"
                value={listOptionsRaw}
                onChange={(e) => setListOptionsRaw(e.target.value)}
              />
              <div className="error">{sendError}</div>
              <div className="ctaRow">
                <button
                  className="primary"
                  type="button"
                  disabled={!validated || sending}
                  onClick={handleSend}
                >
                  {sending ? "Sending..." : "Send list options"}
                </button>
              </div>
              {listOptionStarted ? (
                <>
                  <div className={`statusBanner ${sending ? "statusNeutral" : (listOptionFailures.length ? "statusBad" : "statusGood")}`}>
                    Created {listOptionProcessed} / {listOptionTotal} options. Succeeded: {listOptionSuccess}. Failures: {listOptionFailures.length}.
                  </div>
                  {listOptionResponses.length ? (
                    <table>
                      <thead>
                        <tr>
                          <th>Option</th>
                          <th>Status</th>
                          <th>Result</th>
                        </tr>
                      </thead>
                      <tbody>
                        {listOptionResponses.map((row, idx) => (
                          <tr key={`${row.name}-${idx}`}>
                            <td>{row.name}</td>
                            <td>{row.status}</td>
                            <td>{row.ok ? (row.albertId ? row.albertId : "ID not returned") : extractErrorMessages(row.text)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  ) : null}
                  {listOptionFailures.length ? (
                    <table>
                      <thead>
                        <tr>
                          <th>Failed option</th>
                          <th>Status</th>
                          <th>Error</th>
                        </tr>
                      </thead>
                      <tbody>
                        {listOptionFailures.map((item, idx) => (
                          <tr key={`${item.optionName}-${idx}`}>
                            <td>{item.optionName}</td>
                            <td>{item.status}</td>
                            <td>{item.message}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  ) : null}
                </>
              ) : null}
            </div>
          ) : null}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
