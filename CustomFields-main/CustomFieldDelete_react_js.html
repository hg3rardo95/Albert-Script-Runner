<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Field Delete (React)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 980px;
      margin: 28px auto;
      padding: 0 16px 70px;
      line-height: 1.35;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .muted { opacity: .75; margin: 0 0 16px; }
    .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .right { margin-left: auto; }
    button {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button.danger { background: #8b0000; color: #fff; border-color: #8b0000; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .step {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      background: #fff;
    }
    .title { font-weight: 650; margin-bottom: 8px; }
    label { display: block; margin: 8px 0 6px; font-weight: 650; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    @media (max-width: 760px) {
      .grid, .cards { grid-template-columns: 1fr; }
    }
    .card {
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px;
      background: #fafafa;
    }
    .cardLabel { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
    .cardValue { font-size: 14px; margin-top: 4px; word-break: break-word; }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0 8px;
    }
    .chip {
      border: 1px solid #d0d0d0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #f7f7f7;
      user-select: none;
    }
    .chip.selected {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .hint { font-size: 12px; opacity: .8; margin-top: 6px; white-space: pre-wrap; }
    .error { color: #b00020; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .statusBanner {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .statusGood {
      background: #eaf8ee;
      color: #0f5f2a;
      border-color: #b9e7c5;
    }
    .statusBad {
      background: #fff0f0;
      color: #8b0000;
      border-color: #ffc8c8;
    }
    .statusNeutral {
      background: #f6f6f6;
      color: #222;
      border-color: #e0e0e0;
    }
    .ctaRow {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .suggestionList {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }
    .suggestionBtn {
      text-align: left;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      padding: 10px;
      background: #f9f9f9;
      cursor: pointer;
    }
    .suggestionBtn:hover {
      border-color: #111;
      background: #fff;
    }
    .suggestionBtn.selected {
      border-color: #1f7a3b;
      background: #eaf8ee;
    }
    .suggestionTitle {
      font-weight: 700;
      font-size: 14px;
    }
    .suggestionMeta {
      margin-top: 4px;
      font-size: 12px;
      opacity: .85;
    }
    .suggestionScore {
      margin-top: 4px;
      font-size: 11px;
      opacity: .75;
    }
    pre {
      margin: 10px 0 0;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }
    pre.jwtExpired {
      border-color: #b00020;
      background: #fff5f5;
      color: #b00020;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useMemo, useRef, useState } = React;

    const API_URLS = {
      "Sandbox": "https://sandbox.albertinvent.com",
      "Production": "https://app.albertinvent.com",
      "Dev Environment": "https://dev.albertinventdev.com"
    };

    function baseUrl(envChoice) {
      return (API_URLS[envChoice] || "").replace(/\/+$/, "");
    }

    function decodeJwt(token) {
      const parts = token.split(".");
      if (parts.length !== 3) return null;
      try {
        const payload = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
        return {
          tenantId: payload.tenantId,
          partition: payload.partition,
          class: payload.class,
          name: payload.name,
          email: payload.email,
          iss: payload.iss,
          exp: payload.exp
        };
      } catch {
        return null;
      }
    }

    function isJwtExpiredByDay(info) {
      const expMs = Number(info?.exp) * 1000;
      if (!Number.isFinite(expMs)) return false;
      const expDay = new Date(expMs);
      expDay.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return expDay.getTime() < today.getTime();
    }

    function inferEnvironmentFromIssuer(iss) {
      const raw = String(iss || "").trim();
      if (!raw) return "";

      let host = raw.toLowerCase();
      try {
        const parsed = new URL(raw);
        host = (parsed.hostname || "").toLowerCase();
      } catch {
        // Not a full URL; fall back to direct suffix matching on the raw issuer text.
      }

      if (host.endsWith(".demo")) return "Sandbox";
      if (host.endsWith(".app2")) return "Production";
      if (host.endsWith(".dev")) return "Dev Environment";
      return "";
    }

    function formatJwtInfo(info) {
      if (!info) return null;
      const out = { ...info };
      if ("exp" in out) delete out.exp;
      const expMs = Number(info.exp) * 1000;
      if (Number.isFinite(expMs)) out.expiration = new Date(expMs).toLocaleString();
      return out;
    }

    function pickFirst(field, keys) {
      for (const key of keys) {
        const val = field[key];
        if (val !== undefined && val !== null && val !== "") return val;
      }
      return null;
    }

    function normalizeCustomField(data) {
      if (!data || typeof data !== "object") return null;
      if (data.item && typeof data.item === "object") return data.item;
      if (data.customField && typeof data.customField === "object") return data.customField;
      if (Array.isArray(data.items) && data.items.length) return data.items[0];
      if (data.data && typeof data.data === "object" && !Array.isArray(data.data)) return data.data;
      return data;
    }

    function extractErrorMessages(raw) {
      const messages = [];
      const seen = new Set();

      function pushMessage(msg) {
        const text = String(msg || "").trim();
        if (!text || seen.has(text)) return;
        seen.add(text);
        messages.push(text);
      }

      function walk(value) {
        if (value === null || value === undefined) return;
        if (typeof value === "string") return;
        if (Array.isArray(value)) return value.forEach(walk);
        if (typeof value === "object") {
          if (typeof value.msg === "string") pushMessage(value.msg);
          if (typeof value.message === "string") pushMessage(value.message);
          Object.values(value).forEach(walk);
        }
      }

      let parsed = raw;
      if (typeof raw === "string") {
        const trimmed = raw.trim();
        if (!trimmed) return "(empty response body)";
        try { parsed = JSON.parse(trimmed); }
        catch { return trimmed; }
      }

      walk(parsed);
      if (messages.length) return messages.join("\n");
      if (typeof parsed === "string") return parsed;
      try { return JSON.stringify(parsed, null, 2); }
      catch { return String(parsed); }
    }

    function singularizeModule(service) {
      const map = {
        inventories: "inventory",
        tasks: "task",
        lots: "lot",
        datatemplates: "data template",
        parametergroups: "parameter group",
        projects: "project",
        users: "user"
      };
      const key = String(service || "").trim().toLowerCase();
      if (!key) return "unknown";
      if (map[key]) return map[key];
      if (key.endsWith("ies")) return `${key.slice(0, -3)}y`;
      if (key.endsWith("s")) return key.slice(0, -1);
      return key;
    }

    function similarity(a, b) {
      const sa = String(a || "").toLowerCase();
      const sb = String(b || "").toLowerCase();
      if (!sa || !sb) return 0;
      const dp = Array(sa.length + 1).fill(0).map(() => Array(sb.length + 1).fill(0));
      for (let i = 0; i <= sa.length; i++) dp[i][0] = i;
      for (let j = 0; j <= sb.length; j++) dp[0][j] = j;
      for (let i = 1; i <= sa.length; i++) {
        for (let j = 1; j <= sb.length; j++) {
          const cost = sa[i - 1] === sb[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return 1 - (dp[sa.length][sb.length] / (Math.max(sa.length, sb.length) || 1));
    }

    function isCtfId(value) {
      return /^CTF\d+$/i.test(String(value || "").trim());
    }

    function normalizeStatus(value) {
      return String(value || "").trim().toLowerCase();
    }

    function hiddenRank(value) {
      if (value === false) return 2;
      if (value === true) return 0;
      return 1;
    }

    function scoreLabelNameMatch(query, labelName) {
      const q = String(query || "").trim().toLowerCase();
      const label = String(labelName || "").trim().toLowerCase();
      if (!q || !label) return 0;
      let score = similarity(q, label);
      if (q === label) score += 1;
      else if (label.includes(q)) score += 0.4;
      return score;
    }

    async function fetchCustomFields(envChoice, token) {
      const url = `${baseUrl(envChoice)}/api/v3/customfields/?limit=200`;
      const resp = await fetch(url, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token.trim()}` }
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      const items = Array.isArray(data)
        ? data
        : (Array.isArray(data?.items) ? data.items : (Array.isArray(data?.Items) ? data.Items : []));
      return { status: resp.status, text, items };
    }

    function getCustomFieldId(item) {
      return String(
        pickFirst(item || {}, ["id", "albertId", "ctfId", "customFieldId", "fieldId"]) || ""
      ).trim();
    }

    function makePreviewPayload(sourceField) {
      const payload = { ...sourceField };
      const removeKeys = [
        "id", "albertId", "ctfId", "customFieldId", "fieldId", "guid", "uuid",
        "tenantId", "partition", "createdAt", "updatedAt", "createdBy", "updatedBy",
        "created", "Created", "updated", "Updated", "status", "Status", "deleted", "Deleted", "deletedAt", "DeletedAt", "archived", "Archived", "_id", "__v", "version",
        "options", "listOptions", "values", "allowedValues", "items"
      ];
      for (const key of removeKeys) delete payload[key];
      Object.keys(payload).forEach((key) => {
        if (payload[key] === undefined) delete payload[key];
      });
      if (String(payload.type || "").toLowerCase() !== "list") {
        delete payload.multiselect;
        delete payload.category;
      }
      return payload;
    }

    function orderPayload(payload) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) return {};
      const ordered = {};
      const used = new Set();
      const isList = String(payload.type || "").toLowerCase() === "list";

      const addIfPresent = (key) => {
        if (Object.prototype.hasOwnProperty.call(payload, key)) {
          ordered[key] = payload[key];
          used.add(key);
        }
      };

      addIfPresent("name");
      addIfPresent("labelName");
      addIfPresent("type");
      addIfPresent("service");
      if (isList) {
        addIfPresent("category");
        addIfPresent("multiselect");
      }
      addIfPresent("entityCategory");
      addIfPresent("ui_components");
      addIfPresent("min");
      addIfPresent("max");

      Object.keys(payload)
        .filter((key) => !used.has(key))
        .sort((a, b) => a.localeCompare(b))
        .forEach((key) => {
          ordered[key] = payload[key];
        });

      return ordered;
    }

    async function fetchCustomFieldById(envChoice, token, ctfId) {
      const safeId = encodeURIComponent(ctfId.trim());
      const url = `${baseUrl(envChoice)}/api/v3/customfields/${safeId}`;
      const resp = await fetch(url, {
        method: "GET",
        headers: { "Authorization": `Bearer ${token.trim()}` }
      });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      return { status: resp.status, text, data };
    }

    async function deleteCustomFieldById(envChoice, token, ctfId) {
      const safeId = encodeURIComponent(ctfId.trim());
      const url = `${baseUrl(envChoice)}/api/v3/customfields/${safeId}`;
      const resp = await fetch(url, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token.trim()}` }
      });
      const text = await resp.text();
      return { status: resp.status, text };
    }

    async function hideCustomFieldById(envChoice, token, ctfId) {
      const safeId = encodeURIComponent(ctfId.trim());
      const url = `${baseUrl(envChoice)}/api/v3/customfields/${safeId}`;
      const payload = {
        data: [
          {
            operation: "update",
            attribute: "hidden",
            oldValue: false,
            newValue: true
          }
        ]
      };
      const resp = await fetch(url, {
        method: "PATCH",
        headers: {
          "Authorization": `Bearer ${token.trim()}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      const text = await resp.text();
      return { status: resp.status, text };
    }

    function App() {
      const [envChoice, setEnvChoice] = useState(localStorage.getItem("cfd_env") || "");
      const [token, setToken] = useState(localStorage.getItem("cfd_token") || "");
      const [ctfId, setCtfId] = useState(localStorage.getItem("cfd_ctf_id") || "");
      const [jwtInfo, setJwtInfo] = useState(decodeJwt((localStorage.getItem("cfd_token") || "").trim()));

      const [loading, setLoading] = useState(false);
      const [validateError, setValidateError] = useState("");
      const [field, setField] = useState(null);
      const [fieldActive, setFieldActive] = useState(true);

      const [deleteStatus, setDeleteStatus] = useState("");
      const [deleteStatusType, setDeleteStatusType] = useState("");
      const [deleteErrorDetails, setDeleteErrorDetails] = useState("");
      const [lookupSuggestions, setLookupSuggestions] = useState([]);
      const [selectedSuggestionId, setSelectedSuggestionId] = useState("");
      const [resolvedCtfId, setResolvedCtfId] = useState("");

      const statusRef = useRef(null);

      const jwtExpired = useMemo(() => isJwtExpiredByDay(jwtInfo), [jwtInfo]);
      const previewPayload = useMemo(() => orderPayload(makePreviewPayload(field || {})), [field]);
      const previewText = useMemo(() => JSON.stringify(previewPayload, null, 2), [previewPayload]);
      const fieldHidden = useMemo(() => {
        if (!field || typeof field !== "object") return false;
        if (!Object.prototype.hasOwnProperty.call(field, "hidden")) return false;
        return field.hidden === true;
      }, [field]);

      const canDelete = !!field && !loading && fieldActive;
      const canHide = !!field && !loading && fieldActive && !fieldHidden;

      const fieldSummary = useMemo(() => {
        if (!field) return "";
        const label = field.labelName || field.name || "This field";
        const type = field.type || "unknown";
        const moduleSingular = singularizeModule(field.service);
        return `${label} is the ${type} field in the ${moduleSingular} module.`;
      }, [field]);

      function persist(next = {}) {
        if ("envChoice" in next) localStorage.setItem("cfd_env", next.envChoice);
        if ("token" in next) localStorage.setItem("cfd_token", next.token);
        if ("ctfId" in next) localStorage.setItem("cfd_ctf_id", next.ctfId);
      }

      function clearResults() {
        setValidateError("");
        setField(null);
        setFieldActive(true);
        setDeleteStatus("");
        setDeleteStatusType("");
        setDeleteErrorDetails("");
        setLookupSuggestions([]);
        setSelectedSuggestionId("");
        setResolvedCtfId("");
      }

      async function validateById(env, t, id) {
        const res = await fetchCustomFieldById(env, t, id);
        if (res.status === 401 || res.status === 403) {
          setValidateError("Bearer token is invalid for this environment.");
          return false;
        }
        if (res.status < 200 || res.status > 299) {
          setValidateError(`Custom field lookup failed (${res.status}).`);
          return false;
        }
        const normalized = normalizeCustomField(res.data);
        if (!normalized || typeof normalized !== "object") {
          setValidateError("Custom field response could not be parsed.");
          return false;
        }
        setField(normalized);
        setResolvedCtfId(String(id || "").trim());
        const statusValue = String(normalized.status || "").trim().toLowerCase();
        const inactiveByStatus = statusValue === "inactive";
        setFieldActive(!inactiveByStatus);
        return true;
      }

      async function resolveByLabelName(env, t, labelInput) {
        const lookup = await fetchCustomFields(env, t);
        if (lookup.status === 401 || lookup.status === 403) {
          setValidateError("Bearer token is invalid for this environment.");
          return [];
        }
        if (lookup.status < 200 || lookup.status > 299) {
          setValidateError(`Custom field list lookup failed (${lookup.status}).`);
          return [];
        }

        const candidates = (lookup.items || [])
          .map((item) => {
            const id = getCustomFieldId(item);
            const labelName = String(item?.labelName || "").trim();
            const status = String(item?.status || "").trim() || "unknown";
            if (normalizeStatus(status) === "inactive") return null;
            if (!id || !labelName) return null;
            const score = scoreLabelNameMatch(labelInput, labelName);
            if (score <= 0.6) return null;
            return {
              id,
              labelName,
              module: singularizeModule(item?.service),
              type: String(item?.type || "").trim() || "unknown",
              hidden: item?.hidden,
              score
            };
          })
          .filter(Boolean)
          .sort((a, b) => {
            const hiddenDiff = hiddenRank(b.hidden) - hiddenRank(a.hidden);
            if (hiddenDiff) return hiddenDiff;
            if (b.score !== a.score) return b.score - a.score;
            return a.labelName.localeCompare(b.labelName);
          })
          .slice(0, 5);

        if (!candidates.length) {
          setValidateError("No labelName matches were found.");
          return [];
        }
        setResolvedCtfId("");
        setSelectedSuggestionId("");
        setLookupSuggestions(candidates);
        return candidates;
      }

      async function handleValidate() {
        clearResults();
        const t = token.trim();
        const idOrLabel = ctfId.trim();

        if (!envChoice) return setValidateError("Please select environment.");
        if (!t) return setValidateError("Bearer token is required.");
        if (!idOrLabel) return setValidateError("Custom field ID or labelName is required.");

        const jwt = decodeJwt(t);
        if (!jwt) return setValidateError("Token does not appear to be a JWT (expected 3 segments).");

        setJwtInfo(jwt);
        persist({ envChoice, token, ctfId: idOrLabel });
        setLoading(true);
        try {
          if (isCtfId(idOrLabel)) {
            setSelectedSuggestionId("");
            await validateById(envChoice, t, idOrLabel);
          } else {
            await resolveByLabelName(envChoice, t, idOrLabel);
          }
        } catch (err) {
          setValidateError(`Validation failed: ${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }

      async function handleSuggestionSelect(item) {
        const id = String(item?.id || "").trim();
        if (!id) return;
        setValidateError("");
        setField(null);
        setFieldActive(true);
        setDeleteStatus("");
        setDeleteStatusType("");
        setDeleteErrorDetails("");
        setSelectedSuggestionId(id);
        setLoading(true);
        try {
          await validateById(envChoice, token.trim(), id);
        } catch (err) {
          setValidateError(`Validation failed: ${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }

      async function handleDelete() {
        if (!canDelete) return;
        setDeleteStatus("");
        setDeleteStatusType("");
        setDeleteErrorDetails("");
        setLoading(true);

        try {
          const idToUse = String(resolvedCtfId || ctfId).trim();
          const res = await deleteCustomFieldById(envChoice, token, idToUse);
          if (res.status >= 200 && res.status <= 299) {
            setDeleteStatus("Custom field delete completed.");
            setDeleteStatusType("success");
          } else {
            setDeleteStatus(`Custom field delete failed (${res.status}).`);
            setDeleteStatusType("failure");
            setDeleteErrorDetails(extractErrorMessages(res.text));
          }
        } catch (err) {
          setDeleteStatus(`Custom field delete failed: ${String(err?.message || err)}`);
          setDeleteStatusType("failure");
          setDeleteErrorDetails(String(err?.stack || err?.message || err));
        } finally {
          setLoading(false);
          setTimeout(() => statusRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
        }
      }

      async function handleHide() {
        if (!canHide) return;
        setDeleteStatus("");
        setDeleteStatusType("");
        setDeleteErrorDetails("");
        setLoading(true);

        try {
          const idToUse = String(resolvedCtfId || ctfId).trim();
          const res = await hideCustomFieldById(envChoice, token, idToUse);
          if (res.status >= 200 && res.status <= 299) {
            setDeleteStatus("Custom field hide completed.");
            setDeleteStatusType("success");
            setField((prev) => {
              if (!prev) return prev;
              const next = { ...prev, hidden: true };
              if (next.attributes && typeof next.attributes === "object") {
                next.attributes = { ...next.attributes, hidden: true };
              }
              return next;
            });
          } else {
            setDeleteStatus(`Custom field hide failed (${res.status}).`);
            setDeleteStatusType("failure");
            setDeleteErrorDetails(extractErrorMessages(res.text));
          }
        } catch (err) {
          setDeleteStatus(`Custom field hide failed: ${String(err?.message || err)}`);
          setDeleteStatusType("failure");
          setDeleteErrorDetails(String(err?.stack || err?.message || err));
        } finally {
          setLoading(false);
          setTimeout(() => statusRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
        }
      }

      return (
        <>
          <div className="topbar">
            <h1 style={{ margin: 0 }}>Custom Field Delete (React)</h1>
            <button className="right" type="button" onClick={() => window.location.reload()}>Restart</button>
          </div>
          <p className="muted">
            Use this Custom Field API Builder to delete a custom field in your environment. Answer the questions below to create the payload for the API.
          </p>

          <div className="step">
            <div className="title">Delete Inputs</div>
            <div className="grid">
              <div>
                <label>Environment</label>
                <div className="chips">
                  {Object.keys(API_URLS).map((env) => (
                    <span
                      key={env}
                      className={`chip ${envChoice === env ? "selected" : ""}`}
                      onClick={() => {
                        setEnvChoice(env);
                        persist({ envChoice: env });
                      }}
                    >{env}</span>
                  ))}
                </div>
                <label>Bearer Token</label>
                <input
                  type="password"
                  placeholder="Paste token"
                  value={token}
                  onChange={(e) => {
                    const v = e.target.value;
                    const info = decodeJwt(v.trim());
                    const inferredEnv = inferEnvironmentFromIssuer(info?.iss);
                    setToken(v);
                    setJwtInfo(info);
                    if (inferredEnv) setEnvChoice(inferredEnv);
                    persist(inferredEnv ? { token: v, envChoice: inferredEnv } : { token: v });
                  }}
                />
                <pre className={jwtExpired ? "jwtExpired" : ""}>{jwtInfo ? JSON.stringify(formatJwtInfo(jwtInfo), null, 2) : ""}</pre>
              </div>

              <div>
                <label>Custom Field ID or Name</label>
                <input
                  type="text"
                  placeholder="Example: CTF123 or Name"
                  value={ctfId}
                  onChange={(e) => {
                    const v = e.target.value;
                    setCtfId(v);
                    persist({ ctfId: v });
                  }}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      e.preventDefault();
                      handleValidate();
                    }
                  }}
                />
                {lookupSuggestions.length ? (
                  <div className="suggestionList">
                    {lookupSuggestions.map((item) => (
                      <button
                        key={item.id}
                        type="button"
                        className={`suggestionBtn ${selectedSuggestionId === item.id ? "selected" : ""}`}
                        onClick={() => handleSuggestionSelect(item)}
                        disabled={loading}
                      >
                        <div className="suggestionTitle">{item.labelName}</div>
                        <div className="suggestionMeta">
                          {item.id} | Module: {item.module || "unknown"} | Type: {item.type || "unknown"} | hidden: {item.hidden === true ? "true" : (item.hidden === false ? "false" : "unknown")}
                        </div>
                      </button>
                    ))}
                  </div>
                ) : null}
                {!loading && !isCtfId(ctfId.trim()) && lookupSuggestions.length > 0 && lookupSuggestions.length < 2 && !lookupSuggestions.some((item) => Number(item?.score || 0) >= 0.9) ? (
                  <div className="hint">If fewer than 2 options appear and this environment has more than 200 custom fields, this search may miss matches due to the API limit.</div>
                ) : null}
              </div>
            </div>

            {validateError ? <div className="error">{validateError}</div> : null}
            <div className="ctaRow">
              <button onClick={clearResults} disabled={loading}>Clear Results</button>
              <button className="primary" onClick={handleValidate} disabled={loading}>{loading ? "Working..." : "Validate"}</button>
            </div>
          </div>

          {field ? (
            <div className="step">
              <div className="title">Field Details</div>
              <div className="statusBanner statusNeutral">{fieldSummary}</div>
              {!fieldActive ? (
                <div className="statusBanner statusBad">This custom field is already deleted (status = inactive).</div>
              ) : null}
            </div>
          ) : null}

          {field ? (
            <div className="step">
              <div className="title">Payload Preview</div>
              <pre>{previewText}</pre>
              <div className="ctaRow">
                <button className="primary" onClick={handleHide} disabled={!canHide}>
                  {loading ? "Working..." : (fieldHidden ? "Already Hidden" : "Hide Custom Field")}
                </button>
                <button className="danger" onClick={handleDelete} disabled={!canDelete}>{loading ? "Working..." : (fieldActive ? "Delete Custom Field" : "Already Inactive")}</button>
              </div>
            </div>
          ) : null}

          {deleteStatus ? (
            <div className="step" ref={statusRef}>
              <div className="title">Action Status</div>
              <div className={`statusBanner ${deleteStatusType === "failure" ? "statusBad" : "statusGood"}`}>{deleteStatus}</div>
              {deleteStatusType === "failure" && deleteErrorDetails ? <pre>{deleteErrorDetails}</pre> : null}
            </div>
          ) : null}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
